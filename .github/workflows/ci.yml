name: CI

# La app en sí no tiene build step (ver CLAUDE.md): esto solo corre los tests.
# tests/rendVsAsientoDrill.test.js queda afuera a propósito — necesita archivos
# .xlsx reales de un cliente que no están (ni deben estar) en el repo.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:unit

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  datos-sensibles:
    # Segunda red, por si alguien commiteó sin el hook local instalado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar datos de empleados en los archivos tocados
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1 || true
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD || git ls-files)
          [ -z "$FILES" ] || node scripts/check-datos-sensibles.mjs $FILES
